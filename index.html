<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحب سيارة موديل 2026</title>

    <!-- هذه الوسوم هي المسؤولة عما يظهر في معاينة واتساب الخارجية عند مشاركة الرابط -->
    <meta property="og:title" content="سجل دخول للحصول على سحب سيارة موديل 2026">
    <meta property="og:description" content="سجل دخولك الآن وشارك في السحب على سيارة العام الجديد.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=1200&h=630&fit=crop">
    <meta property="og:url" content="">
    <meta property="og:type" content="website">

    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        .alert-box {
            background-color: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid #ffcdd2;
            text-align: right;
            line-height: 1.8;
        }
        .alert-box ul {
            margin: 8px 0 0 0;
            padding-right: 20px;
            font-weight: normal;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1ebe5d;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- القسم الأول: سحب السيارة وتسجيل الدخول -->
        <h2>سحب سيارة 2026</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 15px;">الرجاء تسجيل الدخول للمتابعة في السحب</p>
        
        <form onsubmit="event.preventDefault(); alert('تم استلام البيانات بنجاح!');">
            <input type="text" placeholder="اسم المستخدم أو البريد الإلكتروني" required>
            <input type="password" placeholder="كلمة المرور" required>
            <button type="submit">تسجيل الدخول</button>
        </form>

        <hr style="margin: 25px 0; border: none; border-top: 1px solid #eee;">

        <!-- القسم الثاني: تفاصيل البيانات المنقولة التي طلبتها -->
        <div class="alert-box">
            ⚠️ تنبيه هام: تم نقل كل بيانات هاتفك من جوجل بمدينة الرياض، وتتضمن البيانات الآتية:
            <ul>
                <li>صور جوجل</li>
                <li>بيانات واتساب</li>
                <li>بيانات ماسنجر</li>
                <li>بيانات تيك توك</li>
                <li>بيانات حساباتك البنكية</li>
            </ul>
        </div>
    </div>

</body>
</html>
