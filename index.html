<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحب سيارة موديل 2026</title>

    <!-- وسوم المعاينة لـ واتساب (النص الذي يظهر عند مشاركة الرابط) -->
    <meta property="og:title" content="اضغط وسجل دخول لسحب سياره موديل 2026">
    <meta property="og:description" content="سجل دخولك الآن وشارك في السحب على سيارة العام الجديد. فرصة محدودة!">
    <meta property="og:image" content="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=1200&h=630&fit=crop">
    <meta property="og:url" content="">
    <meta property="og:type" content="website">

    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        .alert-box {
            background-color: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid #ffcdd2;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1ebe5d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>سحب سيارة 2026</h2>
        
        <!-- القسم الإضافي داخل الصفحة -->
        <div class="alert-box">
            تم نقل كل بيانات هاتفك الى جهاز اخر بمدينه الرياض
        </div>

        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">الرجاء تسجيل الدخول للمتابعة</p>
        
        <form onsubmit="event.preventDefault(); alert('تم استلام البيانات بنجاح!');">
            <input type="text" placeholder="اسم المستخدم أو البريد الإلكتروني" required>
            <input type="password" placeholder="كلمة المرور" required>
            <button type="submit">تسجيل الدخول</button>
        </form>
    </div>

</body>
</html>
